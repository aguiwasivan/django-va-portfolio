<button
    class="theme-toggle"
    type="button"
    data-theme-toggle
    aria-label="Dark mode"
    aria-pressed="false"
    title="Switch to dark mode"
    hidden
>
    <i class="theme-moon" data-lucide="moon" aria-hidden="true"></i>
    <i class="theme-sun" data-lucide="sun" aria-hidden="true"></i>
</button>
